name: Build NotePlus APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-release
  cancel-in-progress: false
env:
  EXPECTED_SIGNER: 5fe39e20cad0ed02b05a41d7a4908f1b285c8721eedbce18b8718a08fe20c8e9
jobs:
  first_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore protected signing identity from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANI_RECOVERY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ani-release.p12"
          echo "ANI_KEYSTORE=$RUNNER_TEMP/ani-release.p12" >> "$GITHUB_ENV"
          echo "ANI_VERSION_CODE=$((300000 + ${{ github.run_number }} * 100 + ${{ github.run_attempt }} * 2 - 1))" >> "$GITHUB_ENV"
      - name: Test, lint and build first signed APK
        env:
          ANI_STORE_PASSWORD: ${{ secrets.ANI_RECOVERY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf' -o app/src/main/res/font/vazirmatn.ttf
          gradle --no-daemon testDebugUnitTest lintRelease assembleRelease
          cp app/build/outputs/apk/release/app-release.apk first.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs first.apk > first-signature.txt
          grep -Fq "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER" first-signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: first-signed-build
          path: |
            first.apk
            first-signature.txt
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-and-lint-reports
          path: app/build/reports/
      - name: Remove temporary signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/ani-release.p12"
  verified_build:
    needs: first_build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore the same signing identity on a fresh runner
        env:
          KEYSTORE_BASE64: ${{ secrets.ANI_RECOVERY_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ani-release.p12"
          echo "ANI_KEYSTORE=$RUNNER_TEMP/ani-release.p12" >> "$GITHUB_ENV"
          echo "ANI_VERSION_CODE=$((300000 + ${{ github.run_number }} * 100 + ${{ github.run_attempt }} * 2))" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: first-signed-build
          path: first-build
      - name: Build next version and compare both certificate fingerprints
        env:
          ANI_STORE_PASSWORD: ${{ secrets.ANI_RECOVERY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/font
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf' -o app/src/main/res/font/vazirmatn.ttf
          gradle --no-daemon assembleRelease assembleDebugAndroidTest
          cp app/build/outputs/apk/release/app-release.apk "Ani-Note-recovery-$ANI_VERSION_CODE.apk"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --verbose --print-certs "Ani-Note-recovery-$ANI_VERSION_CODE.apk" > second-signature.txt
          grep -Fq "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER" second-signature.txt
          grep 'certificate SHA-256 digest:' first-build/first-signature.txt > /tmp/first-cert
          grep 'certificate SHA-256 digest:' second-signature.txt > /tmp/second-cert
          diff -u /tmp/first-cert /tmp/second-cert
          echo 'Two independent builds have the same verified signing certificate.' > signing-verification.txt
          cat /tmp/second-cert >> signing-verification.txt
      - name: Download published versions for coexistence and upgrade tests
        run: |
          curl -fL --retry 3 https://github.com/anishopmobile/Ani-Note/releases/download/main-v205901/Ani-Note-main-205901.apk -o /tmp/original.apk
          curl -fL --retry 3 https://github.com/anishopmobile/Ani-Note/releases/download/recovery-v306402/Ani-Note-recovery-306402.apk -o /tmp/published-recovery.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test coexistence, backup migration and in-place recovery upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            adb install /tmp/original.apk
            adb shell dumpsys package com.anishop.aninote > /tmp/original-before.txt
            adb install /tmp/published-recovery.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e phase seed com.anishop.aninote.recovery.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/seed.txt
            grep -q 'OK (' /tmp/seed.txt
            adb install -r first-build/first.apk
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am instrument -w -e phase verify com.anishop.aninote.recovery.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/verify.txt
            grep -q 'OK (' /tmp/verify.txt
            adb shell pm path com.anishop.aninote | grep 'package:'
            adb shell pm path com.anishop.aninote.recovery | grep 'package:'
            adb shell dumpsys package com.anishop.aninote > /tmp/original-after.txt
            grep 'versionCode=' /tmp/original-before.txt > /tmp/original-version-before.txt
            grep 'versionCode=' /tmp/original-after.txt > /tmp/original-version-after.txt
            diff -u /tmp/original-version-before.txt /tmp/original-version-after.txt
            adb shell am start -W -n com.anishop.aninote.recovery/com.anishop.aninote.MainActivity
      - name: Package verified installable APK
        run: |
          sha256sum "Ani-Note-recovery-$ANI_VERSION_CODE.apk" > SHA256SUMS
          cp docs/RECOVERY-MIGRATION.md RECOVERY-MIGRATION.md
      - name: Publish compatible NotePlus update
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "recovery-v$ANI_VERSION_CODE" "Ani-Note-recovery-$ANI_VERSION_CODE.apk" SHA256SUMS signing-verification.txt RECOVERY-MIGRATION.md --target "$GITHUB_SHA" --title "NotePlus $ANI_VERSION_CODE" --notes-file docs/RECOVERY-MIGRATION.md
      - name: Verify installed 306402 discovers the published update and keeps all settings
        uses: reactivecircus/android-emulator-runner@v2
        with:
          force-avd-creation: true
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            adb install /tmp/published-recovery.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.anishop.aninote.UpdateDiscoveryUiTest -e phase published -e expected_code $ANI_VERSION_CODE com.anishop.aninote.recovery.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/published-discovery.txt
            grep -q 'OK (' /tmp/published-discovery.txt
            adb shell am instrument -w -e class com.anishop.aninote.UpgradeTest -e phase seed -e lock true com.anishop.aninote.recovery.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/settings-seed.txt
            grep -q 'OK (' /tmp/settings-seed.txt
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am instrument -w -e class com.anishop.aninote.UpgradeTest -e phase verify -e lock true com.anishop.aninote.recovery.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/settings-upgrade.txt
            grep -q 'OK (' /tmp/settings-upgrade.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NotePlus-APK
          path: |
            Ani-Note-recovery-*.apk
            SHA256SUMS
            signing-verification.txt
            RECOVERY-MIGRATION.md
          if-no-files-found: error
      - name: Hide release if post-publication verification fails
        if: failure() && steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "recovery-v$ANI_VERSION_CODE" --draft
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-and-upgrade-reports
          path: |
            /tmp/seed.txt
            /tmp/verify.txt
            /tmp/published-discovery.txt
            /tmp/settings-seed.txt
            /tmp/settings-upgrade.txt
            /tmp/original-version-before.txt
            /tmp/original-version-after.txt
            second-signature.txt
      - name: Remove temporary signing material
        if: always()
        run: rm -f -- "$RUNNER_TEMP/ani-release.p12"
