name: Build Android APK
on:
  push:
    branches: [main, feature/calendar-widgets-icon]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/feature/calendar-widgets-icon'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore preview signing key
        id: key
        uses: actions/cache@v4
        with:
          path: ~/.android/ani-preview.keystore
          key: ani-preview-signing-v1
      - name: Prepare version and signing identity
        env:
          PREVIEW_KEYSTORE_BASE64: ${{ secrets.PREVIEW_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          key="$HOME/.android/ani-preview.keystore"
          if [ -n "$PREVIEW_KEYSTORE_BASE64" ]; then
            printf '%s' "$PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$key"
          fi
          gh api --paginate repos/${{ github.repository }}/releases > /tmp/releases.json
          if [ ! -f "$key" ]; then
            if jq -e '.[] | select(.tag_name | startswith("preview-v"))' /tmp/releases.json >/dev/null; then
              echo 'Preview key missing. Restore PREVIEW_KEYSTORE_BASE64; refusing signing-key rotation.' >&2
              exit 1
            fi
            keytool -genkeypair -keystore "$key" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Ani Note Preview' -keyalg RSA -keysize 3072 -validity 10000
          fi
          fingerprint=$(keytool -exportcert -keystore "$key" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          previous=$(jq -r '[.[] | select(.tag_name | test("^preview-v[0-9]+$"))] | sort_by(.tag_name | sub("preview-v";"") | tonumber) | last | .body // ""' /tmp/releases.json)
          if [ -n "$previous" ] && ! grep -Fq "signer-sha256: $fingerprint" <<< "$previous"; then
            echo 'Signing identity mismatch; publication stopped.' >&2
            exit 1
          fi
          code=$((100000 + ${{ github.run_number }} * 100 + ${{ github.run_attempt }} * 2))
          max=$(jq '[.[] | .tag_name | select(test("^preview-v[0-9]+$")) | sub("preview-v";"") | tonumber] | max // 1' /tmp/releases.json)
          test "$code" -gt "$max"
          echo "ANI_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "ANI_KEYSTORE=$key" >> "$GITHUB_ENV"
          echo "SIGNER_SHA256=$fingerprint" >> "$GITHUB_ENV"
      - name: Install Vazirmatn font
        run: |
          mkdir -p app/src/main/res/font
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf' -o app/src/main/res/font/vazirmatn.ttf
      - name: Unit tests, lint and build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - name: Preserve candidate and create prior version
        run: |
          mkdir -p /tmp/upgrade
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/upgrade/candidate.apk
          ANI_VERSION_CODE=$((ANI_VERSION_CODE - 1)) gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/upgrade/baseline.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test in-place upgrade and legacy data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            adb install /tmp/upgrade/baseline.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e phase seed com.anishop.aninote.preview.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/seed.txt
            grep -q 'OK (' /tmp/seed.txt
            adb install -r /tmp/upgrade/candidate.apk
            adb shell am instrument -w -e phase verify com.anishop.aninote.preview.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/verify.txt
            grep -q 'OK (' /tmp/verify.txt
      - name: Package verified APK
        run: |
          cp /tmp/upgrade/candidate.apk "Ani-Note-preview-$ANI_VERSION_CODE.apk"
          sha256sum "Ani-Note-preview-$ANI_VERSION_CODE.apk" > SHA256SUMS
          printf 'Preview test build\n\napplicationId: com.anishop.aninote.preview\nversionCode: %s\nsigner-sha256: %s\n\nInstall over a compatible Preview without uninstalling. Older ephemeral debug keys are incompatible.\n' "$ANI_VERSION_CODE" "$SIGNER_SHA256" > /tmp/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: Ani-Note-preview-APK
          path: |
            Ani-Note-preview-*.apk
            SHA256SUMS
          if-no-files-found: error
      - name: Publish tested Preview
        run: gh release create "preview-v$ANI_VERSION_CODE" "Ani-Note-preview-$ANI_VERSION_CODE.apk" SHA256SUMS --prerelease --target "$GITHUB_SHA" --title "Ani Note Preview $ANI_VERSION_CODE" --notes-file /tmp/release-notes.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/
            /tmp/seed.txt
            /tmp/verify.txt
