name: Build Ani Note Main APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable main signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/ani-main.keystore
          key: ani-main-signing-v1
      - name: Prepare signing and version
        env:
          MAIN_KEYSTORE_BASE64: ${{ secrets.MAIN_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          key="$HOME/.android/ani-main.keystore"
          if [ -n "$MAIN_KEYSTORE_BASE64" ]; then
            printf '%s' "$MAIN_KEYSTORE_BASE64" | base64 --decode > "$key"
          fi
          if [ ! -f "$key" ]; then
            keytool -genkeypair -keystore "$key" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Ani Note Main' -keyalg RSA -keysize 3072 -validity 10000
          fi
          echo "ANI_KEYSTORE=$key" >> "$GITHUB_ENV"
          echo "ANI_VERSION_CODE=$((200000 + ${{ github.run_number }} * 100 + ${{ github.run_attempt }}))" >> "$GITHUB_ENV"
          keytool -list -v -keystore "$key" -storepass android -alias androiddebugkey | grep 'SHA256:' > signing-fingerprint.txt
      - name: Install Vazirmatn font
        run: |
          mkdir -p app/src/main/res/font
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/vazirmatn/Vazirmatn%5Bwght%5D.ttf' -o app/src/main/res/font/vazirmatn.ttf
      - name: Test, lint and build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Prepare main APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Ani-Note-main.apk
          sha256sum Ani-Note-main.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Ani-Note-Main-APK
          path: |
            Ani-Note-main.apk
            SHA256SUMS
            signing-fingerprint.txt
          if-no-files-found: error
